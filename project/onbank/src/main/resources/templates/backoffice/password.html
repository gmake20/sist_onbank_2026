<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 직원(/employee/password), 관리자(/admin/password) 공용 비밀번호 변경 화면. 값은 각 컨트롤러가 넘겨줌 -->
<head>
    <meta charset="UTF-8">
    <title th:text="|ONBANK ${area} 비밀번호 변경|">ONBANK 비밀번호 변경</title>
    <style>
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #0b1d3a; color: #333; }
        .login-wrap { max-width: 400px; margin: 120px auto; padding: 40px; background: #fff; border-radius: 12px; }
        .login-wrap h2 { margin: 0 0 8px; color: #0b1d3a; text-align: center; }
        .login-wrap .sub { margin: 0 0 24px; color: #8a6a00; text-align: center; font-size: 14px; }
        .login-wrap label { display: block; margin-bottom: 4px; font-size: 14px; }
        .login-wrap input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 4px;
                            border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .login-wrap .field { margin-bottom: 12px; }
        .login-wrap button { width: 100%; padding: 12px; border: 0; border-radius: 6px;
                             background: #0b1d3a; color: #fff; font-size: 16px; cursor: pointer; }
        .login-wrap .links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 14px; }
        .login-wrap .links button { width: auto; padding: 0; background: none; color: #1f4e9c; font-size: 14px; }
        .login-wrap .links a { color: #1f4e9c; }
        .msg-error { color: #c0392b; font-size: 14px; margin: 0 0 12px; }
        .msg-info { color: #1f4e9c; font-size: 14px; margin: 0 0 12px; }
        .field-error { display: block; color: #c0392b; font-size: 13px; }
    </style>
</head>
<body>
    <main class="login-wrap">
        <h2>비밀번호 변경</h2>
        <p class="sub" th:text="|ONBANK ${area}|">ONBANK</p>

        <p class="msg-info" th:if="${tempPassword}">임시 비밀번호로 로그인했습니다. 새 비밀번호로 바꾼 뒤 이용할 수 있습니다.</p>

        <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어감 -->
        <form th:action="@{${passwordUrl}}" th:object="${form}" method="post">
            <p class="msg-error" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></p>

            <div class="field">
                <label for="currentPassword" th:text="${tempPassword} ? '임시 비밀번호' : '현재 비밀번호'">현재 비밀번호</label>
                <!-- 비밀번호 칸은 오류가 나도 값을 다시 채우지 않는다 (th:field 대신 name) -->
                <input type="password" id="currentPassword" name="currentPassword" required autofocus>
                <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:text="${#fields.errors('currentPassword')[0]}"></span>
            </div>
            <div class="field">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" maxlength="20" required
                       placeholder="영문·숫자·특수문자 포함 8~20자">
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:text="${#fields.errors('newPassword')[0]}"></span>
            </div>
            <div class="field">
                <label for="newPasswordConfirm">새 비밀번호 확인</label>
                <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" maxlength="20" required>
                <span class="field-error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:text="${#fields.errors('newPasswordConfirm')[0]}"></span>
            </div>
            <button type="submit">변경</button>
        </form>

        <div class="links">
            <!-- 임시 비밀번호 상태에서는 다른 화면으로 갈 수 없으므로 취소 링크를 보여 주지 않는다 -->
            <a th:unless="${tempPassword}" th:href="@{${homeUrl}}">취소</a>
            <span th:if="${tempPassword}"></span>
            <form th:action="@{${logoutUrl}}" method="post">
                <button type="submit">로그아웃</button>
            </form>
        </div>
    </main>
</body>
</html>
