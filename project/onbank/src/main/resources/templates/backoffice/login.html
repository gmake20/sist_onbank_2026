<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 직원(/employee/login), 관리자(/admin/login) 공용 로그인 화면. 값은 각 컨트롤러가 넘겨줌 -->
<head>
    <meta charset="UTF-8">
    <title th:text="|ONBANK ${area} 로그인|">ONBANK 로그인</title>
    <style>
        body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #0b1d3a; color: #333; }
        .login-wrap { max-width: 400px; margin: 120px auto; padding: 40px; background: #fff; border-radius: 12px; }
        .login-wrap h2 { margin: 0 0 8px; color: #0b1d3a; text-align: center; }
        .login-wrap .sub { margin: 0 0 24px; color: #8a6a00; text-align: center; font-size: 14px; }
        .login-wrap input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px;
                            border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .login-wrap button { width: 100%; padding: 12px; border: 0; border-radius: 6px;
                             background: #0b1d3a; color: #fff; font-size: 16px; cursor: pointer; }
        .msg-error { color: #c0392b; font-size: 14px; margin: 0 0 12px; }
        .msg-info { color: #1f4e9c; font-size: 14px; margin: 0 0 12px; }
    </style>
</head>
<body>
    <main class="login-wrap">
        <h2 th:text="|ONBANK ${area} 로그인|">ONBANK 로그인</h2>
        <p class="sub">은행 내부 업무 시스템</p>

        <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어감 -->
        <form th:action="@{${loginUrl}}" method="post">
            <!-- 아이디가 없는지, 비밀번호가 틀렸는지 구분하지 않고 같은 문구로 안내 -->
            <p class="msg-error" th:if="${param.error}" th:text="|${idLabel} 또는 비밀번호가 올바르지 않습니다.|"></p>
            <!-- 실패 사유별 안내 (LoginFailureHandler) -->
            <p class="msg-error" th:if="${param.locked}">비밀번호를 5회 잘못 입력하여 계정이 잠겼습니다. 관리자에게 잠금 해제를 요청하세요.</p>
            <p class="msg-error" th:if="${param.disabled}">사용할 수 없는 계정입니다. 관리자에게 문의하세요.</p>
            <p class="msg-info" th:if="${param.logout}">로그아웃되었습니다.</p>
            <p class="msg-info" th:if="${param.changed}">비밀번호가 변경되었습니다. 새 비밀번호로 다시 로그인해 주세요.</p>
            <p class="msg-error" th:if="${param.expired}">보안을 위해 화면이 만료되었습니다. 다시 로그인해 주세요.</p>

            <input type="text" th:name="${idParam}" th:placeholder="${idLabel}" required autofocus>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>
    </main>
</body>
</html>
