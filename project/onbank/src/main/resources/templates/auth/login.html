<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - ONBANK</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .login-wrap { max-width: 400px; margin: 80px auto; padding: 40px; border: 1px solid #e5e5e5; border-radius: 12px; }
        .login-wrap h2 { margin: 0 0 24px; color: #0b1d3a; text-align: center; }
        .login-wrap input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px;
                            border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .login-wrap button { width: 100%; padding: 12px; border: 0; border-radius: 6px;
                             background: #0b1d3a; color: #fff; font-size: 16px; cursor: pointer; }
        .login-error { color: #c0392b; font-size: 14px; margin: 0 0 12px; }
        .login-info { color: #1a7f37; font-size: 14px; margin: 0 0 12px; }
        .login-link { margin-top: 16px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="login-wrap">
        <h2>로그인</h2>

        <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어감 -->
        <form th:action="@{/login}" method="post">
            <!-- 아이디가 없는지, 비밀번호가 틀렸는지 구분하지 않고 같은 문구로 안내 -->
            <p class="login-error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
            <!-- 실패 사유별 안내 (LoginFailureHandler) -->
            <p class="login-error" th:if="${param.locked}">비밀번호를 5회 잘못 입력하여 로그인이 제한되었습니다. 고객센터로 문의해 주세요.</p>
            <p class="login-error" th:if="${param.disabled}">이용이 정지되었거나 탈퇴한 계정입니다. 고객센터로 문의해 주세요.</p>
            <p class="login-error" th:if="${param.expired}">보안을 위해 화면이 만료되었습니다. 다시 로그인해 주세요.</p>
            <!-- 회원가입 완료 후 이동해 온 경우 (SignupController의 flash 속성) -->
            <p class="login-info" th:if="${msg}" th:text="${msg}"></p>

            <input type="text" name="loginId" placeholder="아이디" required autofocus>
            <input type="password" name="password" placeholder="비밀번호" required>
            <button type="submit">로그인</button>
        </form>

        <p class="login-link">아직 회원이 아니신가요? <a th:href="@{/signup}">회원가입</a></p>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

</body>
</html>
