<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - ONBANK</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .login-wrap { max-width: 400px; margin: 80px auto; padding: 40px; border: 1px solid #e5e5e5; border-radius: 12px; }
        .login-wrap h2 { margin: 0 0 8px; color: #0b1d3a; text-align: center; }
        .login-wrap .sub { margin: 0 0 24px; color: #666; text-align: center; font-size: 14px; }
        .login-wrap label { display: block; margin-bottom: 4px; font-size: 14px; }
        .login-wrap input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 4px;
                            border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .login-wrap .field { margin-bottom: 12px; }
        .login-wrap button { width: 100%; padding: 12px; border: 0; border-radius: 6px;
                             background: #0b1d3a; color: #fff; font-size: 16px; cursor: pointer; }
        .login-error { color: #c0392b; font-size: 14px; margin: 0 0 12px; }
        .field-error { display: block; color: #c0392b; font-size: 13px; }
        .login-link { margin-top: 16px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="login-wrap">
        <h2>비밀번호 찾기</h2>
        <p class="sub">가입 정보를 입력하면 가입한 이메일로 임시 비밀번호를 보내 드립니다.</p>

        <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어감 -->
        <form th:action="@{/password/find}" th:object="${form}" method="post">
            <p class="login-error" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></p>

            <div class="field">
                <label for="loginId">아이디</label>
                <input type="text" th:field="*{loginId}" maxlength="30" required autofocus>
                <span class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></span>
            </div>
            <div class="field">
                <label for="name">이름</label>
                <input type="text" th:field="*{name}" maxlength="30" required>
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="field">
                <label for="birthDate">생년월일</label>
                <input type="date" th:field="*{birthDate}" required>
                <span class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
            </div>
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" th:field="*{email}" maxlength="100" required>
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <button type="submit">임시 비밀번호 받기</button>
        </form>

        <p class="login-link"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

</body>
</html>
