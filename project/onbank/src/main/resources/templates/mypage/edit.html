<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정 - ONBANK</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .edit-wrap { max-width: 440px; margin: 60px auto; padding: 40px; border: 1px solid #e5e5e5; border-radius: 12px; }
        .edit-wrap h2 { margin: 0 0 24px; color: #0b1d3a; text-align: center; }
        .edit-wrap label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; }
        .edit-wrap input[type=text], .edit-wrap input[type=password],
        .edit-wrap input[type=email], .edit-wrap input[type=tel] {
            width: 100%; box-sizing: border-box; padding: 12px;
            border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .edit-wrap .field { margin-bottom: 16px; }
        .edit-wrap .readonly-value { padding: 12px; background: #f3f3f3; border-radius: 6px; font-size: 15px; color: #555; }
        .edit-wrap .agree { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .edit-wrap .hint { font-size: 12px; color: #888; margin: 6px 0 0; }
        .edit-wrap button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 6px;
                            background: #0b1d3a; color: #fff; font-size: 16px; cursor: pointer; }
        .edit-error { color: #c0392b; font-size: 13px; margin: 6px 0 0; }
        .edit-global-error { color: #c0392b; font-size: 14px; margin: 0 0 16px; }
        .edit-links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 14px; }
        .edit-links a { color: #1f4e9c; }
        .edit-links a.withdraw { color: #888; }
        .edit-wrap .inline { display: flex; gap: 8px; align-items: center; }
        .edit-wrap .inline input { flex: 1; min-width: 0; }
        .edit-wrap .inline + .inline { margin-top: 8px; }
        .edit-wrap .btn-sub { width: auto; margin-top: 0; padding: 12px 14px; font-size: 14px; white-space: nowrap;
                              background: #fff; color: #0b1d3a; border: 1px solid #0b1d3a; }
        .edit-wrap .btn-sub:disabled { color: #999; border-color: #ccc; cursor: default; }
        .edit-wrap input[readonly] { background: #f3f3f3; }
        /* 휴대폰·이메일 인증 공용 (verification.js) */
        .verify-timer { min-width: 42px; color: #c0392b; font-size: 14px; }
        .verify-msg { font-size: 13px; margin: 6px 0 0; color: #555; }
        .verify-msg.ok { color: #1a7f37; }
        .verify-msg.fail { color: #c0392b; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="edit-wrap">
        <h2>회원정보 수정</h2>

        <!-- th:action 을 써야 CSRF 토큰이 자동으로 들어감 (인증 API 호출에도 이 토큰을 씀) -->
        <form th:action="@{/mybank/profile/edit}" th:object="${form}" method="post" novalidate>
            <!-- 현재 비밀번호 오류, 중복 등 서비스에서 걸린 오류 -->
            <p class="edit-global-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

            <!-- 본인 식별 정보는 수정하지 않는다 -->
            <div class="field">
                <label>아이디 / 이름</label>
                <div class="readonly-value" th:text="|${info.loginId()} / ${info.name()}|">onbank01 / 홍길동</div>
            </div>

            <!-- 휴대폰 : 바꾼 번호만 인증 (인증을 쓰지 않으면 입력칸만) -->
            <div class="field" th:unless="${phoneVerificationEnabled}">
                <label for="phone">휴대폰 번호</label>
                <input type="tel" th:field="*{phone}" placeholder="숫자만 입력 (예: 01012345678)" maxlength="11">
                <p class="edit-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            </div>
            <div class="field" th:if="${phoneVerificationEnabled}">
                <label for="phone">휴대폰 번호</label>
                <div class="inline">
                    <input type="tel" th:field="*{phone}" placeholder="숫자만 입력 (예: 01012345678)" maxlength="11"
                           th:readonly="${phoneVerified}">
                    <button type="button" id="btnSendCode" class="btn-sub" th:data-url="@{/api/phone/send}"
                            th:disabled="${phoneVerified}" th:text="${phoneVerified} ? '인증 완료' : '인증번호 받기'">인증번호 받기</button>
                </div>
                <div class="inline" id="codeRow" hidden>
                    <input type="text" id="phoneCode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"
                           autocomplete="one-time-code">
                    <span class="verify-timer" id="phoneTimer"></span>
                    <button type="button" id="btnVerifyCode" class="btn-sub" th:data-url="@{/api/phone/verify}">확인</button>
                </div>
                <p id="phoneMsg" class="verify-msg" th:classappend="${phoneVerified} ? 'ok'"
                   th:text="${phoneVerified} ? '휴대폰 인증이 완료되었습니다.' : ''"></p>
                <p class="hint">번호를 바꿀 때만 인증이 필요합니다.</p>
                <p class="edit-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            </div>

            <!-- 이메일 : 비밀번호 찾기의 임시 비밀번호가 가는 주소라 바꾼 주소는 인증받는다 -->
            <div class="field" th:unless="${emailVerificationEnabled}">
                <label for="email">이메일</label>
                <input type="email" th:field="*{email}" maxlength="100">
                <p class="edit-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="field" th:if="${emailVerificationEnabled}">
                <label for="email">이메일</label>
                <div class="inline">
                    <input type="email" th:field="*{email}" maxlength="100" th:readonly="${emailVerified}">
                    <button type="button" id="btnSendEmailCode" class="btn-sub" th:data-url="@{/api/email/send}"
                            th:disabled="${emailVerified}" th:text="${emailVerified} ? '인증 완료' : '인증번호 받기'">인증번호 받기</button>
                </div>
                <div class="inline" id="emailCodeRow" hidden>
                    <input type="text" id="emailCode" inputmode="numeric" maxlength="6" placeholder="인증번호 6자리"
                           autocomplete="one-time-code">
                    <span class="verify-timer" id="emailTimer"></span>
                    <button type="button" id="btnVerifyEmailCode" class="btn-sub" th:data-url="@{/api/email/verify}">확인</button>
                </div>
                <p id="emailMsg" class="verify-msg" th:classappend="${emailVerified} ? 'ok'"
                   th:text="${emailVerified} ? '이메일 인증이 완료되었습니다.' : ''"></p>
                <p class="hint">이메일을 바꿀 때만 인증이 필요합니다. 비밀번호 찾기의 임시 비밀번호가 이 주소로 발송됩니다.</p>
                <p class="edit-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="field">
                <label class="agree"><input type="checkbox" th:field="*{marketingAgreed}"> (선택) 마케팅 정보 수신에 동의합니다.</label>
            </div>

            <!-- 비밀번호는 오류로 화면이 다시 열려도 값을 다시 채우지 않는다 (th:field 대신 name) -->
            <div class="field">
                <label for="currentPassword">현재 비밀번호</label>
                <input type="password" id="currentPassword" name="currentPassword" placeholder="본인 확인을 위해 입력하세요">
                <p class="edit-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
            </div>

            <button type="submit">저장</button>
        </form>

        <div class="edit-links">
            <a th:href="@{/mybank/profile}">취소</a>
            <a class="withdraw" th:href="@{/mybank/profile/withdraw}">회원 탈퇴</a>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

    <script th:if="${phoneVerificationEnabled or emailVerificationEnabled}" th:src="@{/js/verification.js}"></script>
</body>
</html>
