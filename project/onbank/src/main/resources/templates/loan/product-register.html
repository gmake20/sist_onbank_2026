<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>대출 상품 등록 - ONBANK</title>

<link rel="stylesheet" th:href="@{/css/index.css}">
<link rel="stylesheet" th:href="@{/css/loan/loan-product-register.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: headerFragment}"></div>

	<main class="loan-register-page">

		<div class="register-container">

			<div class="register-heading">
				<span class="page-label">ONBANK ADMIN</span>
				<h1>대출 상품 등록</h1>
				<p>고객에게 제공할 새로운 대출 상품을 등록합니다.</p>
			</div>

			<form th:action="@{/loan/categories/credit}" th:object="${loanProductForm}"
				method="post" class="register-form">

				<input type="hidden" th:if="${_csrf != null}"
					th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

				<div class="form-section-title">
					<h2>기본 상품 정보</h2>
					<p>필수 항목을 입력해주세요.</p>
				</div>


				<!-- 대출 카테고리 -->
				<div class="form-group">

					<label for="category"> 대출 카테고리 <em>*</em>
					</label> <select id="category" th:field="*{category}" required>

						<option value="">대출 종류를 선택하세요</option>
						<option value="credit">신용대출</option>
						<option value="mortgage">담보대출</option>
						<option value="jeonse">전월세/반환보증</option>
						<option value="auto">자동차대출</option>
						<option value="group">집단중도금/이주비대출</option>
						<option value="housing">주택도시기금대출</option>
						<option value="business">개인사업자대출</option>

					</select> <small class="field-error"
						th:if="${#fields.hasErrors('category')}" th:errors="*{category}">
					</small>

				</div>

				<!-- 상품명 -->
				<div class="form-group">
					<label for="name">상품명 <em>*</em></label> <input type="text"
						id="name" th:field="*{name}" maxlength="100"
						placeholder="예: ON 직장인 신용대출"> <small class="field-error"
						th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
				</div>

				<!-- 상품 설명 -->
				<div class="form-group">
					<label for="subtitle">상품 설명 <em>*</em></label>

					<textarea id="subtitle" th:field="*{subtitle}" maxlength="255"
						rows="3" placeholder="상품에 대한 간단한 설명"></textarea>

					<small class="field-error" th:if="${#fields.hasErrors('subtitle')}"
						th:errors="*{subtitle}"></small>
				</div>

				<div class="form-grid">

					<!-- 대출 대상 -->
					<div class="form-group">
						<label for="target">대출 대상 <em>*</em></label> <input type="text"
							id="target" th:field="*{target}" placeholder="예: 직장인"> <small
							class="field-error" th:if="${#fields.hasErrors('target')}"
							th:errors="*{target}"></small>
					</div>

					<!-- 상품 태그 -->
					<div class="form-group">
						<label for="tag">상품 분류 태그</label> <select id="tag"
							th:field="*{tag}">
							<option value="">선택하세요</option>
							<option value="직장인">직장인</option>
							<option value="소액대출">소액대출</option>
							<option value="생활자금">생활자금</option>
							<option value="주택담보">주택담보</option>
							<option value="기타">기타</option>
						</select>
					</div>

					<!-- 대출 한도 -->
					<div class="form-group">
						<label for="limit">대출 한도 <em>*</em></label> <input type="text"
							id="limit" th:field="*{limit}" placeholder="예: 최대 1억원"> <small
							class="field-error" th:if="${#fields.hasErrors('limit')}"
							th:errors="*{limit}"></small>
					</div>

					<!-- 상환 방법 -->
					<div class="form-group">
						<label for="method">상환 방법 <em>*</em></label> <select id="method"
							th:field="*{method}">
							<option value="">선택하세요</option>
							<option value="원리금균등">원리금균등상환</option>
							<option value="원금균등">원금균등상환</option>
							<option value="만기일시상환">만기일시상환</option>
						</select> <small class="field-error" th:if="${#fields.hasErrors('method')}"
							th:errors="*{method}"></small>
					</div>

					<!-- 연 이자율 -->
					<div class="form-group">
						<label for="annualInterestRate"> 연 이자율 (%) <em>*</em>
						</label> <input type="number" id="annualInterestRate"
							th:field="*{annualInterestRate}" min="0" max="100" step="0.0001"
							placeholder="예: 4.5"> <small class="field-error"
							th:if="${#fields.hasErrors('annualInterestRate')}"
							th:errors="*{annualInterestRate}"></small>
					</div>

					<!-- 최대 대출 기간 -->
					<div class="form-group">
						<label for="maxTermMonths"> 최대 대출 기간 (개월) <em>*</em>
						</label> <input type="number" id="maxTermMonths"
							th:field="*{maxTermMonths}" min="1" max="600" placeholder="예: 60">

						<small class="field-error"
							th:if="${#fields.hasErrors('maxTermMonths')}"
							th:errors="*{maxTermMonths}"></small>
					</div>

				</div>

				<div class="register-actions">

					<a th:href="@{/loan/products}" class="btn-cancel"> 취소 </a>

					<button type="submit" class="btn-submit">상품 등록하기</button>

				</div>

			</form>

		</div>

	</main>

	<div th:replace="~{fragments/footer :: footerFragment}"></div>

</body>
</html>
