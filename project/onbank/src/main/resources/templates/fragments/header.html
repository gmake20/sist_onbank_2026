<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="headerFragment">
	<header class="header-wrap">
		<div class="header-logo">
			<!-- 텍스트 기반 고급 로고 세팅 -->
			<a href="/">ON<span>BANK</span></a>
		</div>
		<nav class="header-nav">
			<ul>
				<li><a href="/personal">개인뱅킹</a></li>
				<li><a href="/corporate">기업뱅킹</a></li>
				<li><a th:href="@{/financial-products}"> 금융상품 </a></li>
				<li><a href="/asset">자산관리</a></li>
				<li><a href="/customer">고객센터</a></li>
				<li><a th:href="@{/branches}">지점/ATM</a></li>
			</ul>
		</nav>
		<div class="header-login">
			<!-- 로그인하지 않은 경우 -->
			<a href="/signup" sec:authorize="isAnonymous()"
				style="padding: 8px 12px; color: #d4af37;">회원가입</a> <a href="/login"
				sec:authorize="isAnonymous()"
				style="border: 1px solid #d4af37; padding: 8px 20px; border-radius: 20px; color: #d4af37;">로그인</a>
			<!-- 로그인한 경우 : 로그아웃은 POST 폼으로 (CSRF 보호) -->
			<form th:action="@{/logout}" method="post"
				sec:authorize="isAuthenticated()"
				style="display: flex; align-items: center; gap: 12px; margin: 0;">
				<!-- 이름을 누르면 마이페이지 (회원정보) -->
				<a th:href="@{/mybank/profile}" style="color: inherit;"><strong
					sec:authentication="principal.name"></strong>님</a>
				<button type="submit"
					style="background: none; border: 1px solid #d4af37; padding: 8px 20px; border-radius: 20px; color: #d4af37; cursor: pointer; font: inherit;">로그아웃</button>
			</form>
		</div>
	</header>
</div>
</html>
