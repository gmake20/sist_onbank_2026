<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 계좌 - ONBANK</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/account.css}">
</head>
<body>

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="account-container">
        <h2 class="page-title">내 계좌</h2>

        <!-- 없는 계좌·남의 계좌로 접근했을 때 -->
        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <div class="account-section">
            <div class="section-title-wrap">
                <h3>입출금</h3>
            </div>
            <div class="section-header">
                <div class="left-area">
                    <span class="total-balance">총잔액 :
                        <strong th:text="|${#numbers.formatInteger(totalBalance, 1, 'COMMA')}원|">0원</strong>
                    </span>
                </div>
            </div>
            <table class="account-table">
                <colgroup>
                    <col style="width: 25%;">
                    <col style="width: 12%;">
                    <col style="width: 18%;">
                    <col style="width: 20%;">
                    <col style="width: 25%;">
                </colgroup>
                <thead>
                    <tr>
                        <th>계좌번호</th>
                        <th>상태</th>
                        <th>최종거래일</th>
                        <th>잔액(원)</th>
                        <th>바로가기</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="account : ${accounts}">
                        <td th:text="${account.accountNumber}">1002-862-000000</td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${'status-' + #strings.toLowerCase(account.accountStatus)}"
                                  th:text="${statusNames[account.accountStatus] ?: account.accountStatus}">정상</span>
                        </td>
                        <td th:text="${account.lastTransactionAt != null} ? ${#temporals.format(account.lastTransactionAt, 'yyyy.MM.dd')} : '-'">2026.10.15</td>
                        <td class="balance" th:text="${#numbers.formatInteger(account.balance ?: 0, 1, 'COMMA')}">0</td>
                        <td class="actions">
                            <a class="btn-sm" th:href="@{/mybank/accounts/{id}(id=${account.accountId})}">조회</a>
                            <a class="btn-sm" th:if="${account.canDeposit()}"
                               th:href="@{/mybank/accounts/{id}/deposit(id=${account.accountId})}">입금</a>
                            <a class="btn-sm" th:if="${account.canWithdraw()}"
                               th:href="@{/mybank/accounts/{id}/withdraw(id=${account.accountId})}">출금</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(accounts)}">
                        <td colspan="5" class="empty-row">
                            <p>보유 중인 계좌가 없습니다.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

</body>
</html>
