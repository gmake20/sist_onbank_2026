<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예적금 상품 | ONBANK</title>
<link rel="stylesheet" th:href="@{/css/index.css}">
<link rel="stylesheet" th:href="@{/css/savings/savings.css}">
</head>
<body>
	<div th:replace="~{fragments/header :: headerFragment}"></div>
	<main class="save-wrap">
		<div class="save-head">
			<span>ONBANK · SAVINGS</span>
			<h1>예적금 상품</h1>
			<p>정기예금 또는 정기적금 상품을 선택하세요.</p>
		</div>
		<p class="alert error" th:if="${error}" th:text="${error}"></p>
		<a th:href="@{/savings/mine}">내 예적금 조회 →</a>
		<section class="save-grid">
			<article class="save-card" th:each="p:${products}">
				<span class="pill"
					th:text="${p.type.name() == 'FIXED_DEPOSIT' ? '정기예금' : '정기적금'}"></span>
				<h2 th:text="${p.name}">상품명</h2>
				<p>
					<strong th:text="${p.annualRate}">3.00</strong>% · <span
						th:text="${p.termMonths}">12</span>개월
				</p>
				<p class="minor">
					가입/월 납입 금액: <span
						th:text="${#numbers.formatInteger(p.minAmount,1,'COMMA')}"></span>원
					~ <span th:text="${#numbers.formatInteger(p.maxAmount,1,'COMMA')}"></span>원
				</p>
				<form th:action="@{/savings/enroll}" method="post">
					<input type="hidden" name="productId" th:value="${p.id}"><label>출금
						입출금계좌 ID (임시 입력)</label><input type="number" min="1"
						name="sourceAccountId" required placeholder="본인 계좌 ID"><label
						th:text="${p.type.name() == 'FIXED_DEPOSIT' ? '예치 원금 (원)' : '월 납입액 (원)'}"></label><input
						type="number" name="amount" required th:min="${p.minAmount}"
						th:max="${p.maxAmount}" step="1"><input
						th:if="${_csrf != null}" type="hidden"
						th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button type="submit">가입하기</button>
				</form>
			</article>
		</section>
		<p class="footnote">임시 버전에서는 입출금계좌 ID를 입력합니다. 운영 UI에서는 본인 계좌 목록에서
			선택하도록 변경하세요.</p>
	</main>
</body>
</html>
