spring.application.name=onbank


#
server.port=80

# JPA 설정  
spring.jpa.database=mysql
spring.jpa.generate-ddl=false
# 테이블은 docs/schema-team*-mysql.sql 로 만들고, JPA는 엔티티와 테이블이 맞는지 검사만 합니다.
# (update는 공용 DB를 자동으로 바꾸므로 사용하지 않음)
spring.jpa.hibernate.ddl-auto=validate
# 컬럼 이름 규칙: Spring Boot 기본값 사용 (필드 loginId → 컬럼 login_id, 모두 소문자)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 날짜/시간을 한국 시간 기준으로 저장 (가입일시, 로그인 이력 등)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 프로필: 기본은 local (배포 시 --spring.profiles.active=prod 로 변경)
spring.profiles.active=local

# mysql DB 설정
# 접속 정보(url, username, password)는 Git에 올리지 않고 application-local.properties 에 둡니다.
# application-local.properties.example 을 복사해서 만드세요.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false

# 회원가입 휴대폰 인증 사용 여부
# 문자 서비스(ApiSmsSender) 연동 전까지 false : 인증 없이 가입 통과
# 개발 중 인증 흐름을 확인하려면 application-local.properties 에 true 로 덮어쓰기 (인증번호는 콘솔에 출력)
onbank.phone-verification.enabled=false

# 가상 OTP 시드 암호화 키 (AES-256, Base64 44글자). Git에 올리지 않고 환경변수 OTP_SEED_KEY 또는 application-local.properties 로 넣는다
# 공용 DB를 쓰므로 팀원 모두 같은 키를 써야 한다. 비어 있어도 앱은 시작하지만 OTP 발급·검증은 오류가 난다
onbank.otp.seed-key=${OTP_SEED_KEY:}

# 메일 실제 발송 여부 (비밀번호 찾기 등)
# false : 보내지 않고 콘솔에 출력 (ConsoleEmailSender)
# true  : spring.mail.* 설정으로 실제 발송 (SmtpEmailSender). application-local.properties 에 메일 설정과 함께 true 로 덮어쓰기
onbank.mail.enabled=false

# 회원가입 이메일 인증 사용 여부 (비밀번호 찾기의 임시 비밀번호를 받을 주소인지 확인)
# 메일 발송(onbank.mail.enabled)이 false 여도 인증번호가 콘솔에 출력되므로 개발 중에도 켜 둔다
onbank.email-verification.enabled=true
