spring.application.name=onbank


#
server.port=80

# JPA 설정  
spring.jpa.database=mysql
spring.jpa.generate-ddl=false  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 프로필: 기본은 local (배포 시 --spring.profiles.active=prod 로 변경)
spring.profiles.active=local

# mysql DB 설정
# 접속 정보(url, username, password)는 Git에 올리지 않고 application-local.properties 에 둡니다.
# application-local.properties.example 을 복사해서 만드세요.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.thymeleaf.cache=false   
